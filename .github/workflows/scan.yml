name: moon
on:
  schedule:
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: moon
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: moon_state.json
          key: moon-state-${{ github.run_id }}
          restore-keys: moon-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python moon_signal_bot.py --source twelvedata --once --publish .
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - run: |
          git config user.name "moon-bot"
          git config user.email "moon-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "feed update" && git push)
